# Lint, type checks and tests on every push and pull request.
#
# The backend job builds the test database from scratch (recreate_test_db:
# create, migrate from zero, seed) - so every run also proves the
# migrations apply to an empty database - and fails on model changes
# without a migration (makemigrations --check).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.10.1
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: progeo.tests.settings
      TESTS_ACTIVE: '1'
      SECRET_KEY: ci-only-not-a-secret-0123456789abcdefghijklmnopqrstuvwxyz
      DJANGO_ALLOWED_HOSTS: testserver,localhost
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ''
      SENTRY_DSN: ''
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # The version of the backend image (docker/backend-base/Dockerfile).
          python-version: '3.13.7'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cad-test.txt

      - name: System packages (ffmpeg for the video export, gpg for the backup bundles)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg gnupg

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-cad-test.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check progeo conftest.py

      - name: Models without a migration
        run: python manage.py makemigrations --check --dry-run --settings=progeo.tests.settings

      - name: Test database (create, migrate from zero, seed)
        run: python manage.py recreate_test_db --settings=progeo.tests.settings --noinput

      - name: Tests
        run: >-
          pytest -q -p no:cacheprovider --tb=short
          --cov=progeo --cov-report=term --cov-report=xml:coverage.xml

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # The version of the frontend image (docker/frontend/Dockerfile).
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .

      # 66 findings in the current code (setState in effects, refs read
      # during render, hook deps, impure render): reported, not blocking,
      # until they are fixed - then drop continue-on-error.
      - name: Lint (oxlint)
        continue-on-error: true
        run: npm run lint

      - name: Tests (vitest)
        run: npx vitest run --watch=false

  # Known vulnerabilities in the dependencies. Reported, not blocking yet:
  # turn continue-on-error off once the current findings are dealt with.
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.7'

      - name: Python (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'

      - name: npm (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
