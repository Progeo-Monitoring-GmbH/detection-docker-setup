# Login endpoints: at most 30 requests per minute and client address (zone
# "login" in conf.d/progeo.conf.template), bursts of 20 pass at once - a
# whole office behind one NAT address still logs in, a password guesser is
# slowed down before it reaches Django's own lockout (helper/login_throttle.py).
#
#   /api/token/                   JWT login (not /api/token/refresh/)
#   /auth/login/                  DRF token login
#   /api/auth-support/login-link/..., password-reset/...,
#   access-requests/ and access-requests/verify/...
#                                 public, unauthenticated, send mails
#                                 (not access-requests/me/: polled by pending users)
#
# Include in a server block, before the other backend locations: the first
# matching regex location wins.
location ~ ^/(api/token/$|auth/login/|api/auth-support/(login-link/|password-reset/|access-requests/($|verify/))) {
    limit_req zone=login burst=20 nodelay;
    limit_req_status 429;

    set $backend_upstream progeo-backend:8383;
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
