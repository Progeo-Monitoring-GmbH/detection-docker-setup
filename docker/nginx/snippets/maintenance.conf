# "Wartungsarbeiten" page instead of nginx's bare "502 Bad Gateway" while an
# upstream is not reachable - e.g. the backend container still runs its start
# scripts (docker/backend/run-server.sh) or the frontend container is down.
#
# Only nginx's own 502 (connection refused / container not resolvable) is
# replaced: proxy_intercept_errors stays off, so error responses that Django
# itself sends pass through unchanged. Answered as 503 + Retry-After, so
# clients and monitoring see "temporarily unavailable". $maintenance_page
# (nginx.conf) serves JSON to API clients, the HTML page to browsers.
#
# Include in a server block. Locations with an error_page of their own (the
# monitoring UIs, snippets/monitoring_auth.conf) don't inherit this one.
error_page 502 =503 $maintenance_page;

# Page, logo and font. Public: the page is shown under the URL of the failed
# request, so it loads its assets from here - ^~ wins over the regex
# locations (block_scanners.conf, the backend paths), nothing is proxied.
location ^~ /__maintenance/ {
    root /usr/share/nginx/maintenance;
    access_log off;

    add_header Retry-After 30 always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
