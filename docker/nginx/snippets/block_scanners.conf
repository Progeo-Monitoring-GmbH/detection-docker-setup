# Requests of vulnerability scanners looking for leaked secrets (.env, .git,
# rclone.conf, dumps, keys) or PHP/CMS installs. None of these exist in this
# stack, so they are dropped here instead of reaching Django or the frontend.
# 444 = nginx closes the connection without sending any response.
#
# Include this at the TOP of a server block: regex locations are matched in
# config order and the first match wins, so it must come before the other
# regex locations (e.g. ^/(v1|api|...)/). User files under /media/ and the
# internal /protected-media/ may have any name and are never matched.

# Hidden files and directories (/.env, /x/.env, /.git/config, /.aws/ ...),
# except /.well-known/ (ACME challenges, security.txt).
location ~ ^(?!/(?:media|protected-media|static)/).*/\.(?!well-known(?:/|$)) {
    return 444;
}

# Secrets, configs, database dumps and editor/backup copies by file name.
location ~* ^(?!/(?:media|protected-media|static)/).*\.(?:env|ini|conf|cfg|config|bak|backup|old|orig|save|swp|sql|sqlite3?|db|pem|key|crt|p12|pfx|kdbx|htaccess|htpasswd|ya?ml|toml|log)$ {
    return 444;
}

# PHP / CMS / Java admin tools - none of them run here.
location ~* ^(?!/(?:media|protected-media|static)/).*(?:\.php\d?$|\.aspx?$|\.jsp$|/wp-(?:admin|content|includes|login)|/phpmyadmin|/cgi-bin/|/vendor/phpunit|/actuator(?:/|$)|/server-status) {
    return 444;
}
