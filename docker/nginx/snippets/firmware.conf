# Flash bundles for the field app (STRATEGY.md section 4): public static files
# from media/firmware (the ./media:/media:ro mount). release.sh / promote.sh
# upload them through the backend API /v1/firmware/ (helper/firmware.py);
# nginx only serves them - the app verifies every signature itself.
#
#   GET /firmware/versions                  channels/stable.json
#   GET /firmware/versions/<channel>        channels/<channel>.json
#   GET /firmware/versions/<channel>.sig    channels/<channel>.json.sig
#   GET /firmware/bundles/<file>            bundles/<file> (.zip/.sig/.sha256)
#   anything else under /firmware/          404, no directory listing
#
# Include in a server block. ^~ wins over the regex locations
# (block_scanners.conf, the backend paths), so /firmware/ never reaches Django.
location ^~ /firmware/ {
    root /media;                    # /firmware/x -> /media/firmware/x
    autoindex off;

    # add_header here disables inheriting the server's lines, so they are
    # repeated. The nested locations have none and inherit all of these.
    # Cache-Control without "always": a 404 (bundle not uploaded yet) must
    # not be cached as immutable for a year.
    add_header Cache-Control $firmware_cache_control;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Channel files change with every release: the app revalidates (ETag).
    # The channel name is restricted to [a-z]+, so no path tricks.
    location = /firmware/versions {
        set $firmware_cache_control "no-cache";
        try_files /firmware/channels/stable.json =404;
    }
    location ~ ^/firmware/versions/(?<channel>[a-z]+)$ {
        set $firmware_cache_control "no-cache";
        try_files /firmware/channels/$channel.json =404;
    }
    location ~ ^/firmware/versions/(?<channel>[a-z]+)\.sig$ {
        set $firmware_cache_control "no-cache";
        default_type text/plain;
        try_files /firmware/channels/$channel.json.sig =404;
    }

    # Bundles are immutable (a fix is a new release). Only plain file names:
    # the upload's temp files (".upload-XXXX") are never served.
    # Range requests work for static files, so the app can resume downloads.
    location ~ ^/firmware/bundles/[A-Za-z0-9][A-Za-z0-9._-]*\.(?:zip|sig|sha256)$ {
        set $firmware_cache_control "public, max-age=31536000, immutable";
        types {
            application/zip zip;
            text/plain sig sha256;
        }
    }

    return 404;                     # everything else, incl. /firmware/channels/ directly
}
