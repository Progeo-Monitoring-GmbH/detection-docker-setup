# Proxy to progeo-matrix (server block of MATRIX_DOMAIN in progeo.conf). The
# upstream is a variable, so nginx starts without the "messenger" profile too.
# Without a URI in proxy_pass, nginx passes the request URI unchanged -
# Synapse needs encoded room/user IDs exactly as sent.
set $matrix_upstream progeo-matrix:8008;
proxy_pass http://$matrix_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
