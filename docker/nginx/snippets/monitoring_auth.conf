# Include in the locations of the monitoring UIs (progeo.conf.template): every
# request first asks Django (location = /_monitoring_auth) whether the session
# belongs to a superuser. 401 = no session -> admin login, 403 stays 403.
# $monitoring_user is the Django user name, for Grafana's auth proxy.
auth_request /_monitoring_auth;
auth_request_set $monitoring_user $upstream_http_x_monitoring_user;
error_page 401 = @monitoring_login;
