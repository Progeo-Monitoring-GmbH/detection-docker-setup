# Proxy to progeo-mas (MATRIX_AUTH_DOMAIN server block and the Matrix
# login/logout/refresh routes in progeo.conf). A variable upstream, so nginx
# starts without the "messenger" profile too.
set $mas_upstream progeo-mas:8080;
proxy_pass http://$mas_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
