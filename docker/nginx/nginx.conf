worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

worker_rlimit_nofile 10000;

events {
    worker_connections 4000;
    # multi_accept on;
}

http {

    ##
    # Basic Settings
    ##

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    ##
    # SSL Settings
    ##

    # TLS 1.0/1.1 are broken and no supported client needs them; the legacy
    # GPRS controllers speak plain http (port 80 server below).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    ##
    # Logging Settings
    ##

    # The access log goes to the container's stdout (docker logs, the portal's
    # log viewer): device tokens in ?token= are masked like Django's
    # SanitizeURLFilter does (progeo/logging.py). Otherwise "combined".
    map $request_uri $loggable_request_uri {
        "~*^(?<uri_head>[^?]*\?(?:[^#]*&)?)token=[^&#]*(?<uri_tail>.*)$" "${uri_head}token=***${uri_tail}";
        default $request_uri;
    }
    log_format sanitized '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $loggable_request_uri $server_protocol" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log sanitized;
    error_log /var/log/nginx/error.log;

    ##
    # Gzip Settings
    ##

    gzip on;

    # gzip_vary on;
    # gzip_proxied any;
    # gzip_comp_level 6;
    # gzip_buffers 16 8k;
    # gzip_http_version 1.1;
    # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    client_max_body_size 100M;

    # Maintenance answer for an unreachable upstream (snippets/maintenance.conf):
    # browsers (navigation sends text/html) get the page, API clients (axios
    # sends application/json) a JSON body. Regexes are tried in order.
    map $http_accept $maintenance_page {
        default              /__maintenance/index.html;
        "~*text/html"        /__maintenance/index.html;
        "~*application/json" /__maintenance/maintenance.json;
    }

    ##
    # Virtual Host Configs
    ##

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;

    root /etc/nginx;

    server {
        listen 80 default_server;
        server_name _;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Legacy GPRS controllers (ESP8266 Lua firmware, Host data-progeo.net):
        # GET /gprs_<project>.php?data=... over plain http - they can neither
        # do TLS nor follow the redirect below, so this goes straight to Django
        # (progeo/v1/legacy/gprs.py). Must stay ABOVE the scanner include,
        # which drops every *.php request (first matching regex wins).
        location ~ ^/gprs_\d+\.php$ {
            resolver 127.0.0.11 ipv6=off valid=30s;
            set $backend_upstream progeo-backend:8383;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Scanners are dropped right here instead of being redirected to https.
        include /etc/nginx/snippets/block_scanners.conf;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
}
