# Single-binary Loki for the backend's log files (shipped by progeo-alloy).
# Started with -config.expand-env=true: ${VAR:-default} comes from compose.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: ${LOKI_RETENTION_PERIOD:-30d}
  # Lines are stamped when Alloy reads them; a restart of Alloy may resend a
  # few older ones.
  reject_old_samples: true
  reject_old_samples_max_age: 1w
  # One small Loki: no automatic stream sharding - it only polled its own
  # ingester for stream rates every few seconds ("unable to get stream rates
  # from ingester 127.0.0.1:9096 ... DeadlineExceeded").
  shard_streams:
    enabled: false

# Deletes chunks older than retention_period.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 50

# Offline-capable: no calls home.
analytics:
  reporting_enabled: false
