apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://progeo-prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  # Log files of the backend (logs/backend/*.log, errors.jsonl), shipped by progeo-alloy.
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://progeo-loki:3100
    editable: false
    jsonData:
      maxLines: 1000

  # Firing alerts and silences of progeo-alertmanager (Alerting -> Alert list / Silences).
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://progeo-alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
