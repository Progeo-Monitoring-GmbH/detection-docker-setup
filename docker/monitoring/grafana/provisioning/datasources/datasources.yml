apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://progeo-prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  # Firing alerts and silences of progeo-alertmanager (Alerting -> Alert list / Silences).
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://progeo-alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
