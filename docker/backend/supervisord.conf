[supervisord]
nodaemon=true
user=root
logfile=/var/log/progeo/supervisord.log
logfile_maxbytes=15MB
pidfile=/run/supervisord.pid
childlogdir=/var/log/progeo

[program:cron]
command=/usr/sbin/crond -f -l 5 -L /var/log/progeo/cron.log -c /etc/crontabs
stdout_logfile=/var/log/progeo/cron-supervisor.log
stdout_logfile_maxbytes=15MB
stderr_logfile=/var/log/progeo/cron-supervisor.err.log
stderr_logfile_maxbytes=15MB
user=root
autostart=true
autorestart=true
priority=10
startsecs=0

[program:run-server]
command=/bin/bash /home/progeo/detection-docker-setup/run-server.sh %(ENV_PORT)s
user=progeo
environment=HOME="/home/progeo/detection-docker-setup",USER="progeo"
autostart=true
autorestart=true
startsecs=5
priority=20
stdout_logfile=/var/log/progeo/backend.log
stdout_logfile_maxbytes=15MB
stderr_logfile=/var/log/progeo/backend.err.log
stderr_logfile_maxbytes=15MB
stopasgroup=true
killasgroup=true

[program:celery-worker]
command=/bin/bash -c "cd /home/progeo/detection-docker-setup; . /etc/profile; . ${VENV_ROOT:-/opt/venv}/bin/activate; celery -A progeo.celery worker --loglevel=info -E --pool=prefork"
user=progeo
environment=HOME="/home/progeo/detection-docker-setup",USER="progeo"
autostart=true
autorestart=true
startsecs=5
priority=30
stdout_logfile=/var/log/progeo/celery-worker.log
stdout_logfile_maxbytes=15MB
redirect_stderr=true
stopasgroup=true
killasgroup=true

[program:celery-beat]
command=/bin/bash -c "cd /home/progeo/detection-docker-setup; . /etc/profile; . ${VENV_ROOT:-/opt/venv}/bin/activate; celery -A progeo.celery beat --loglevel=info"
user=progeo
environment=HOME="/home/progeo/detection-docker-setup",USER="progeo"
autostart=true
autorestart=true
startsecs=5
priority=31
stdout_logfile=/var/log/progeo/celery-beat.log
stdout_logfile_maxbytes=15MB
redirect_stderr=true
stopasgroup=true
killasgroup=true

