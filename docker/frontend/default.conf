server {
    listen 80;
    listen 443;

    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff2 font/woff;

    # The frontend calls the backend on its own origin (no VITE_BACKEND_URL),
    # so the backend paths are proxied to Django here. That keeps direct access
    # (e.g. http://192.168.161.1:3003 on the controller hotspot) working
    # without any DNS name. Variables + resolver: nginx still starts while
    # the backend container is down.
    resolver 127.0.0.11 ipv6=off valid=30s;
    client_max_body_size 100M;

    location ~ ^/(v1|api|auth|media|static|aadmin)/ {
        set $backend_upstream progeo-backend:8383;
        proxy_pass http://$backend_upstream;
        # $http_host keeps the port, so Django's CSRF origin check (admin)
        # matches the browser's Origin header.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        set $backend_upstream progeo-backend:8383;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 1h;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Large media handed over by AuthenticatedMediaView (X-Accel-Redirect),
    # same as in docker/nginx/conf.d/progeo.conf.template. Needs the ./media
    # mount on /media (docker-compose).
    location /protected-media/ {
        internal;
        alias /media/;
    }

    location / {
        add_header X-Progeo-Frontend-Route "frontend-root" always;
        add_header Cache-Control no-cache;
        try_files '' /index.html =404;
    }

    location /assets/ {
        add_header X-Progeo-Frontend-Route "frontend-assets" always;
        types {
            text/html       html htm shtml;
            text/css        css;
            application/javascript js;
            application/json json;
            image/png       png;
            image/jpeg      jpg;
            image/gif       gif;
            image/svg+xml   svg;
            font/woff2      woff2;
            font/woff       woff;
            font/ttf        ttf;
        }

        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;

        # Serve static files directly
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        open_file_cache max=1000 inactive=20s;
        open_file_cache_valid 30s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;

        add_header Vary "Accept-Encoding";
    }

    location /favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
    }
}
