[tool:pytest]
minversion = 7.0

python_files =
    tests.py
    test_*.py
    *_tests.py

testpaths =
    progeo

# pytest's defaults plus pytest-of-*: the pytester runs leave temp dirs with
# their own conftest.py there (PYTEST_DEBUG_TEMPROOT=progeo/tests) - collected,
# they shadow the real conftest and the next run fails to import.
norecursedirs =
    *.egg
    .*
    _darcs
    build
    CVS
    dist
    node_modules
    venv
    {arch}
    pytest-of-*
    __pycache__

# Coverage is opt-in (CI, or locally: pytest --cov=progeo --cov-report=html):
# measuring every single-test run made it slow.
addopts =
    --reuse-db
    --no-migrations
    --no-header
    --ds=progeo.tests.settings

# Live log off: a run prints results, not every DEBUG line. The full DEBUG
# log still goes to progeo/tests/_pytest.log (log_file below).
log_cli = false
log_cli_level = DEBUG
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = progeo/tests/_pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s %(levelname)s %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
    requests: tests involving HTTP requests
    sql: tests involving database operations
    sftp: tests involving SFTP
    modbus: tests involving Modbus
    http_client: tests using a Django or DRF test client
    access: authentication, authorization and user management
    alarms: alarm evaluation, reports and escalation
    backups: backup, restore and transfer
    databases: database management, routing and test setup
    demo: public demo account and views
    devices: devices, controllers and firmware
    exports: data and plan exports
    integrations: external systems, imports and protocols
    locations: locations, plans, access points and status
    measurements: measurements, climate, heatmaps and noise profiles
    notifications: email, SMS and messaging
    operations: monitoring, logs, tasks and operational tools
    depends_on(*nodeids): explicit upstream test node IDs for --failed-dependents


[coverage:run]
branch = true
source =
    progeo

omit =
    dev.py
    */tests/*
    */migrations/*
    */wsgi.py
    */asgi.py


[coverage:report]
ignore_errors = true
show_missing = true
skip_empty = true

exclude_also =
    if __name__ == "__main__":
    except IOError:
    def __str__


[coverage:html]
directory = coverage_html_report


[playwright:codegen]
timezone = Europe/Berlin