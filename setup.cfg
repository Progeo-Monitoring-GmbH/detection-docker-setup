[tool:pytest]
minversion = 7.0

python_files =
    tests.py
    test_*.py
    *_tests.py

testpaths =
    progeo

addopts =
    --reuse-db
    --no-migrations
    --no-header
    --cov=progeo
    --cov-report=term-missing
    --cov-report=html:coverage_html_report
    --ds=progeo.tests.settings

log_cli = true
log_cli_level = DEBUG
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = progeo/tests/_pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s %(levelname)s %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
    requests: tests involving HTTP requests
    sql: tests involving database operations
    sftp: tests involving SFTP
    modbus: tests involving Modbus
    http_client: tests using a Django or DRF test client
    access: authentication, authorization and user management
    alarms: alarm evaluation, reports and escalation
    backups: backup, restore and transfer
    databases: database management, routing and test setup
    demo: public demo account and views
    devices: devices, controllers and firmware
    exports: data and plan exports
    integrations: external systems, imports and protocols
    locations: locations, plans, access points and status
    measurements: measurements, climate, heatmaps and noise profiles
    notifications: email, SMS and messaging
    operations: monitoring, logs, tasks and operational tools
    depends_on(*nodeids): explicit upstream test node IDs for --failed-dependents


[coverage:run]
branch = true
source =
    progeo

omit =
    dev.py
    */tests/*
    */migrations/*
    */wsgi.py
    */asgi.py


[coverage:report]
ignore_errors = true
show_missing = true
skip_empty = true

exclude_also =
    if __name__ == "__main__":
    except IOError:
    def __str__


[coverage:html]
directory = coverage_html_report


[playwright:codegen]
timezone = Europe/Berlin