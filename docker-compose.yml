# Regular commands:
# docker rm -f progeo-database && docker volume rm detection-docker-setup_postgres_data && docker-compose down && docker-compose build && docker-compose up -d && docker logs -f progeo-backend
# docker rm -f progeo-database && docker volume rm detection-docker-setup_postgres_data && docker-compose build && docker-compose up -d
# docker exec -it progeo-backend bash

services:
  #See for ENVS https://www.postgresql.org/docs/current/libpq-envars.html
  progeo-database:
    container_name: progeo-database
    build:
      context: .
      dockerfile: docker/database/Dockerfile
      args:
        DJANGO_DATABASES: ${DJANGO_DATABASES}
    restart: unless-stopped
    # ~1000 project databases: 100 connections (Postgres default) run out. Size the
    # memory settings per server in .env (stock defaults fit small devices).
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-300}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-1GB}
    shm_size: ${POSTGRES_SHM_SIZE:-256mb}
    ports:
      - '${LIMITED_ACCESS:-127.0.0.1:}${POSTGRES_PORT}:${POSTGRES_PORT}'
    environment:
      TZ: 'Europe/Berlin'
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKEND_PORT: ${BACKEND_PORT}
    networks:
      database_net:
        aliases:
          - progeo-database
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Used for django websocket connections
  progeo-redis:
    image: redis:latest
    container_name: progeo-redis
    restart: always
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - '${LIMITED_ACCESS}${REDIS_PORT}:6379'
    networks:
      redis_net:
        aliases:
          - progeo-redis

  # Django backend (using REST-API)
  progeo-backend:
    container_name: progeo-backend
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        BACKEND_PORT: ${BACKEND_PORT}
        DB_HOST: ${POSTGRES_HOST}
        DB_PORT: ${POSTGRES_PORT}
        DOCKER_UID: ${DOCKER_UID:-1000}
        DOCKER_GID: ${DOCKER_GID:-1000}
        DOCKER_SOCKET_GID: ${DOCKER_SOCKET_GID:-1001}
    depends_on:
      - progeo-database
      - progeo-redis
    ports:
      - '${LIMITED_ACCESS}${BACKEND_PORT}:8383'
    volumes:
      - ./media:/home/progeo/detection-docker-setup/media:rw
      - ./logs/backend:/var/log/progeo:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /var/lib/misc:/var/lib/misc:rw
      # SSH key for the daily backup transfer (BACKUP_REMOTE_KEY_FILE, default
      # /etc/progeo/backup/id_ed25519) - outside media/, which the API serves.
      - ./secrets/backup:/etc/progeo/backup:ro
      # The host's .env + django.env, never baked into the (public) image:
      # start-supervisord.sh builds django.env from them on every start.
      # create_host_path: false - a missing file fails instead of becoming a directory.
      - type: bind
        source: ./.env
        target: /etc/progeo/.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./django.env
        target: /etc/progeo/django.env
        read_only: true
        bind:
          create_host_path: false
    environment:
      PROTOCOL: ${PROTOCOL}
      FRONTEND_PORT: ${FRONTEND_PORT}
      FULL_BACKEND_URL: ${BACKEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      DJANGO_DATABASES: ${DJANGO_DATABASES}
      POSTGRES_DB: ${POSTGRES_DB}
      PROJECT_DB_SPLIT: ${PROJECT_DB_SPLIT:-False}
      PROJECT_DB_STRICT: ${PROJECT_DB_STRICT:-False}
      PROJECT_DB_PREFIX: ${PROJECT_DB_PREFIX:-}
      DEMO_DATABASE: ${DEMO_DATABASE:-demo}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DOCKER_UID: ${DOCKER_UID:-1000}
      DOCKER_GID: ${DOCKER_GID:-1001}
      DOCKER_SOCKET_GID: ${DOCKER_SOCKET_GID:-1001}
      DOCKER_HOST: unix:///var/run/docker.sock
      # Hand large media downloads (backups > 1GB) to nginx via X-Accel-Redirect.
      MEDIA_X_ACCEL: /protected-media
      # Periodic celery tasks beat must not start, e.g. "all" during the migration.
      CELERY_DISABLED_TASKS: ${CELERY_DISABLED_TASKS:-}
      # Cron jobs that must not run (docker/backend/start-supervisord.sh), e.g. "all".
      CRON_DISABLED_JOBS: ${CRON_DISABLED_JOBS:-}
      # Error tracking (progeo/sentry.py); disabled while SENTRY_DSN is empty.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-dev}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      SENTRY_SERVER_NAME: ${SENTRY_SERVER_NAME:-}
      # Bearer token of GET /metrics (progeo/metrics.py); empty = endpoint off.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    group_add:
      - '${DOCKER_SOCKET_GID:-1001}'
    cap_add:
      - NET_ADMIN
    security_opt:
      - label:user:progeo
      - label:role:progeo
    networks:
      default_net:
        aliases:
          - progeo-backend
      database_net:
      redis_net:

  progeo-frontend:
    container_name: progeo-frontend
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        FRONTEND_URL: ${FRONTEND_URL}
        FRONTEND_PORT: ${FRONTEND_PORT}
        # "staging" turns on the pink staging frame + banner (default: production).
        VITE_SERVER_ENV: ${VITE_SERVER_ENV:-production}
    environment:
      - NODE_OPTIONS=--max-old-space-size=8196
      - MAX_OLD_SPACE_SIZE=8196
      - SHELL=/bin/sh
    ports:
      - '${LIMITED_ACCESS}${FRONTEND_PORT}:80'
    volumes:
      # Read-only media for X-Accel-Redirect downloads proxied through this
      # container (see docker/frontend/default.conf).
      - ./media:/media:ro
    networks:
      default_net:
        aliases:
          - progeo-frontend

  progeo-nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: progeo-nginx
    environment:
      - ENABLE_SSL=${ENABLE_SSL:-false}
      - NGINX_ALWAYS_TLS_REDIRECT="on"
      - DNS_FRONT_NAMES=${DNS_FRONT_NAMES}
      - DNS_BACK_NAMES=${DNS_BACK_NAMES}
      - CERT_MODE=${CERT_MODE}
      - CERT_LOCAL=${CERT_LOCAL}
      - CERT_PATH=${CERT_PATH}
      - CERT_FILE=${CERT_FILE}
      - CERT_KEY=${CERT_KEY}
      - CERT_PASS=${CERT_PASS}
    restart: always
    ports:
      - 80:80
      - 443:443
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - progeo-frontend
      - progeo-backend
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ${CERT_LOCAL}:/etc/nginx/ssl
      - /var/www/:/var/www/
      # Read-only view of the media dir so nginx can serve large files that
      # AuthenticatedMediaView hands over via X-Accel-Redirect.
      - ./media:/media:ro
    networks:
      default_net:
        aliases:
          - dashboard.progeo.app
          - api.progeo.app
      # Proxies /grafana/ and /flower/ (progeo.conf.template). Fixed address:
      # Grafana trusts the auth proxy header from this address only.
      monitoring_net:
        ipv4_address: ${MONITORING_NGINX_IP:-172.31.250.250}

  # Optional helper: only built + started when COMPOSE_PROFILES=cad_factory
  # is set (see .env). With the profile inactive the image is not built and
  # the container not started.
  progeo-cad_factory:
    container_name: progeo-cad_factory
    restart: 'no'
    profiles: ["cad_factory"]
    build:
      context: .
      dockerfile: docker/cad_factory/Dockerfile
    volumes:
      - ./media:/workspace/media:rw
    networks:
      default_net:

  # ---------------------------------------------------------------------------
  # Monitoring (docker/monitoring/README.md) - only built + started with the
  # compose profile "monitoring", e.g. COMPOSE_PROFILES=monitoring in .env.
  # The UIs are proxied by nginx on /grafana/, /prometheus/ and /flower/ (Django
  # superusers only) and listen on MONITORING_BIND (127.0.0.1 = SSH tunnel).
  # ---------------------------------------------------------------------------
  progeo-prometheus:
    image: prom/prometheus:v3.13.4
    container_name: progeo-prometheus
    restart: unless-stopped
    profiles: ['monitoring']
    entrypoint: ['/bin/sh', '/etc/prometheus/entrypoint.sh']
    # nginx serves the UI on /prometheus/ and strips the prefix: links use it,
    # the routes don't (Grafana and the scrape config keep their URLs).
    command:
      - --web.enable-lifecycle
      - --web.external-url=${MONITORING_URL:-http://localhost}/prometheus/
      - --web.route-prefix=/
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      FLOWER_USER: ${FLOWER_USER:-flower}
      FLOWER_PASSWORD: ${FLOWER_PASSWORD:-}
      NODE_EXPORTER_TARGET: ${MONITORING_GATEWAY:-172.31.250.1}:9100
      PROMETHEUS_RETENTION_TIME: ${PROMETHEUS_RETENTION_TIME:-30d}
      PROMETHEUS_RETENTION_SIZE: ${PROMETHEUS_RETENTION_SIZE:-5GB}
    ports:
      - '${MONITORING_BIND:-127.0.0.1}:${PROMETHEUS_UI_PORT:-9090}:9090'
    volumes:
      - ./docker/monitoring/prometheus/entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - ./docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      monitoring_net:
      # Scrapes progeo-backend:8383/metrics directly.
      default_net:

  progeo-alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: progeo-alertmanager
    restart: unless-stopped
    profiles: ['monitoring']
    entrypoint: ['/bin/sh', '/etc/alertmanager/entrypoint.sh']
    # Single instance: no cluster port.
    command: ['--cluster.listen-address=']
    environment:
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      ALERT_SERVER_NAME: ${ALERT_SERVER_NAME:-}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_FROM: ${ALERT_SMTP_FROM:-}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
    volumes:
      - ./docker/monitoring/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    networks:
      monitoring_net:

  progeo-grafana:
    image: grafana/grafana-oss:12.4.3
    container_name: progeo-grafana
    restart: unless-stopped
    profiles: ['monitoring']
    depends_on:
      - progeo-prometheus
    environment:
      # Applied on the very first start only (then stored in grafana_data).
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      # Offline-capable: no calls home.
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana-dashboards/django-api.json
      # Behind nginx on /grafana/: nginx lets only Django superusers through and
      # sends their user name, Grafana logs them in with it (auth proxy, new
      # users become org admins). The header counts only from nginx's address -
      # over the SSH tunnel (localhost:3000/grafana/) it is the normal login.
      GF_SERVER_ROOT_URL: ${MONITORING_URL:-http://localhost}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_AUTH_PROXY_ENABLED: 'true'
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: 'true'
      GF_AUTH_PROXY_WHITELIST: ${MONITORING_NGINX_IP:-172.31.250.250}
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
    ports:
      - '${MONITORING_BIND:-127.0.0.1}:${GRAFANA_UI_PORT:-3000}:3000'
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      monitoring_net:

  # Celery tasks + workers from the worker events (celery worker -E); same
  # broker as progeo/celery.py. REDIS_PASSWORD must be URL-safe here, otherwise
  # set FLOWER_BROKER_URL with the percent-encoded password.
  progeo-flower:
    image: mher/flower:2.1.0
    container_name: progeo-flower
    restart: unless-stopped
    profiles: ['monitoring']
    command: ['celery', 'flower']
    environment:
      CELERY_BROKER_URL: ${FLOWER_BROKER_URL:-redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/0}
      FLOWER_PORT: 5555
      # nginx proxies /flower/ unchanged (Prometheus scrapes /flower/metrics).
      FLOWER_URL_PREFIX: flower
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-flower}:${FLOWER_PASSWORD:-}
      # Default buckets end at 10s - longer runs all landed in +Inf ("10 s" in Grafana).
      FLOWER_TASK_RUNTIME_METRIC_BUCKETS: '0.1,0.5,1,2.5,5,10,20,30,60,120,300,600,1800,3600'
      TZ: 'Europe/Berlin'
    ports:
      - '${MONITORING_BIND:-127.0.0.1}:${FLOWER_UI_PORT:-5555}:5555'
    depends_on:
      - progeo-redis
    networks:
      monitoring_net:
      redis_net:

  # Logs in as the read-only role from scripts/setup_monitoring_db_user.sh.
  progeo-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: progeo-postgres-exporter
    restart: unless-stopped
    profiles: ['monitoring']
    # Top 100 statements by total time, with their normalized text ($1, $2 - no values).
    command:
      - --collector.stat_statements
      - --collector.stat_statements.include_query
      - --collector.stat_statements.query_length=200
      - --collector.long_running_transactions
      # Database sizes come from progeo-postgres-sizes-exporter: pg_database_size()
      # of ~1000 databases on every 60s scrape cost the server ~3s of work a minute.
      - --no-collector.database
    environment:
      DATA_SOURCE_URI: ${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_MONITOR_USER:-progeo_monitor}
      DATA_SOURCE_PASS: ${POSTGRES_MONITOR_PASSWORD:-}
    depends_on:
      - progeo-database
    networks:
      monitoring_net:
      database_net:

  # Only the database sizes, scraped every 15 minutes (prometheus.yml, job
  # "postgres-sizes") - same read-only role as progeo-postgres-exporter.
  progeo-postgres-sizes-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: progeo-postgres-sizes-exporter
    restart: unless-stopped
    profiles: ['monitoring']
    command:
      - --disable-default-metrics
      - --no-collector.locks
      - --no-collector.replication
      - --no-collector.replication_slots
      - --no-collector.roles
      - --no-collector.settings
      - --no-collector.stat_activity
      - --no-collector.stat_archiver
      - --no-collector.stat_bgwriter
      - --no-collector.stat_database
      - --no-collector.stat_progress_vacuum
      - --no-collector.stat_replication
      - --no-collector.stat_user_tables
      - --no-collector.statio_user_tables
      - --no-collector.wal
    environment:
      DATA_SOURCE_URI: ${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_MONITOR_USER:-progeo_monitor}
      DATA_SOURCE_PASS: ${POSTGRES_MONITOR_PASSWORD:-}
    depends_on:
      - progeo-database
    networks:
      monitoring_net:
      database_net:

  progeo-redis-exporter:
    image: oliver006/redis_exporter:v1.93.0
    container_name: progeo-redis-exporter
    restart: unless-stopped
    profiles: ['monitoring']
    environment:
      REDIS_ADDR: redis://${REDIS_HOST}:${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Length of the celery queue (list "celery" in db 0) = task backlog.
      REDIS_EXPORTER_CHECK_SINGLE_KEYS: db0=celery
    depends_on:
      - progeo-redis
    networks:
      monitoring_net:
      redis_net:

  # CPU, memory and restarts per container.
  progeo-cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    container_name: progeo-cadvisor
    restart: unless-stopped
    profiles: ['monitoring']
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false
      # Keeps it light on small devices.
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,hugetlb,referenced_memory,cpu_topology,resctrl,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      monitoring_net:

  # Host CPU, memory, disk and network. Runs in the host network namespace (for
  # the real network interfaces) and listens on the monitoring_net gateway only,
  # so it is reachable from the host and progeo-prometheus but not from outside.
  progeo-node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: progeo-node-exporter
    restart: unless-stopped
    profiles: ['monitoring']
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=${MONITORING_GATEWAY:-172.31.250.1}:9100
    volumes:
      - /:/host:ro,rslave
    depends_on:
      - progeo-prometheus

networks:
  default_net:
  database_net:
  redis_net:
  # Fixed subnet: progeo-node-exporter listens on its gateway (MONITORING_GATEWAY),
  # the bridge gets a fixed name for host firewall rules (docker/monitoring/README.md).
  monitoring_net:
    driver_opts:
      com.docker.network.bridge.name: br-progeo-mon
    ipam:
      config:
        - subnet: ${MONITORING_SUBNET:-172.31.250.0/24}
          gateway: ${MONITORING_GATEWAY:-172.31.250.1}

volumes:
  postgres_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
