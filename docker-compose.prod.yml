# Production compose: runs the PREBUILT, signed images from Docker Hub -
# nothing is built here, so this works fully offline after `docker pull`.
#
# Set IMAGE_VERSION to the release to deploy (same value used by
# scripts/build_push_images.sh), e.g.:
#   IMAGE_VERSION=1.0.0 docker compose -f docker-compose.prod.yml up -d
#
# To verify image signatures on pull (Docker Content Trust):
#   DOCKER_CONTENT_TRUST=1 docker compose -f docker-compose.prod.yml pull
#
# All other configuration (ports, credentials, DNS names, ...) comes from the
# same .env file as the dev compose.

# docker compose -f docker-compose.prod.yml up -d

services:
  #See for ENVS https://www.postgresql.org/docs/current/libpq-envars.html
  progeo-database:
    image: progeomonitoring/detection-docker-setup:database-${IMAGE_VERSION:-latest}
    container_name: progeo-database
    restart: unless-stopped
    ports:
      - '${LIMITED_ACCESS:-127.0.0.1:}${POSTGRES_PORT}:${POSTGRES_PORT}'
    environment:
      TZ: 'Europe/Berlin'
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKEND_PORT: ${BACKEND_PORT}
    networks:
      database_net:
        aliases:
          - progeo-database
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Used for django websocket connections
  progeo-redis:
    image: redis:latest
    container_name: progeo-redis
    restart: always
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - '${LIMITED_ACCESS}${REDIS_PORT}:6379'
    networks:
      redis_net:
        aliases:
          - progeo-redis

  # Django backend (using REST-API)
  progeo-backend:
    image: progeomonitoring/detection-docker-setup:backend-${IMAGE_VERSION:-latest}
    container_name: progeo-backend
    restart: unless-stopped
    depends_on:
      - progeo-database
      - progeo-redis
    ports:
      - '${LIMITED_ACCESS}${BACKEND_PORT}:8383'
    volumes:
      - ./media:/home/progeo/detection-docker-setup/media:rw
      - ./logs/backend:/var/log/progeo:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /var/lib/misc:/var/lib/misc:rw
    environment:
      PROTOCOL: ${PROTOCOL}
      FULL_BACKEND_URL: ${BACKEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      DJANGO_DATABASES: ${DJANGO_DATABASES}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DOCKER_UID: ${DOCKER_UID:-1000}
      DOCKER_GID: ${DOCKER_GID:-1001}
      DOCKER_SOCKET_GID: ${DOCKER_SOCKET_GID:-1001}
      DOCKER_HOST: unix:///var/run/docker.sock
      # Hand large media downloads (backups > 1GB) to nginx via X-Accel-Redirect.
      MEDIA_X_ACCEL: /protected-media
    group_add:
      - '${DOCKER_SOCKET_GID:-1001}'
    cap_add:
      - NET_ADMIN
    security_opt:
      - label:user:progeo
      - label:role:progeo
    networks:
      default_net:
        aliases:
          - progeo-backend
      database_net:
      redis_net:

  progeo-frontend:
    image: progeomonitoring/detection-docker-setup:frontend-${IMAGE_VERSION:-latest}
    container_name: progeo-frontend
    restart: unless-stopped
    environment:
      - NODE_OPTIONS=--max-old-space-size=8196
      - MAX_OLD_SPACE_SIZE=8196
      - SHELL=/bin/sh
    ports:
      - '${LIMITED_ACCESS}${FRONTEND_PORT}:80'
    networks:
      default_net:
        aliases:
          - progeo-frontend

  progeo-nginx:
    image: progeomonitoring/detection-docker-setup:nginx-${IMAGE_VERSION:-latest}
    container_name: progeo-nginx
    environment:
      - ENABLE_SSL=${ENABLE_SSL:-false}
      - NGINX_ALWAYS_TLS_REDIRECT="on"
      - DNS_FRONT_NAMES=${DNS_FRONT_NAMES}
      - DNS_BACK_NAMES=${DNS_BACK_NAMES}
      - CERT_MODE=${CERT_MODE}
      - CERT_LOCAL=${CERT_LOCAL}
      - CERT_PATH=${CERT_PATH}
      - CERT_FILE=${CERT_FILE}
      - CERT_KEY=${CERT_KEY}
      - CERT_PASS=${CERT_PASS}
    restart: always
    ports:
      - 80:80
      - 443:443
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - progeo-frontend
      - progeo-backend
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ${CERT_LOCAL}:/etc/nginx/ssl
      - /var/www/:/var/www/
      # Read-only view of the media dir so nginx can serve large files that
      # AuthenticatedMediaView hands over via X-Accel-Redirect.
      - ./media:/media:ro
    networks:
      default_net:
        aliases:
          - dashboard.progeo.app
          - api.progeo.app

  # Optional helper: only started when COMPOSE_PROFILES=cad_factory is set.
  progeo-cad_factory:
    image: progeomonitoring/detection-docker-setup:cad_factory-${IMAGE_VERSION:-latest}
    container_name: progeo-cad_factory
    restart: 'no'
    profiles: ['cad_factory']
    volumes:
      - ./media:/workspace/media:rw
    networks:
      default_net:

networks:
  default_net:
  database_net:
  redis_net:

volumes:
  postgres_data:
